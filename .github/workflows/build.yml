name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: ls -la

      - name: Unzip project
        run: |
          set -e
          if [ -f SCManager.zip ]; then
            unzip -o SCManager.zip -d work
          else
            ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then unzip -o "$ZIP" -d work
            elif [ -f settings.gradle.kts ]; then echo "PROJECT_DIR=." >> $GITHUB_ENV; exit 0
            else echo "ERROR: SCManager.zip missing"; ls -la; exit 1; fi
          fi
          if [ -f work/SCManager/settings.gradle.kts ]; then echo "PROJECT_DIR=work/SCManager" >> $GITHUB_ENV
          elif [ -f work/settings.gradle.kts ]; then echo "PROJECT_DIR=work" >> $GITHUB_ENV
          else
            FOUND=$(find work -name "settings.gradle.kts" | head -1)
            [ -n "$FOUND" ] || { find work -maxdepth 4 -type f | head -50; exit 1; }
            echo "PROJECT_DIR=$(dirname "$FOUND")" >> $GITHUB_ENV
          fi
          grep PROJECT_DIR $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android commandline tools
        run: |
          set -e
          ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses >/tmp/licenses.txt || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls -la
          gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          set -e
          find "${{ env.PROJECT_DIR }}" -name "*.apk" -type f 2>/dev/null || true
          APK=\( (find " \){{ env.PROJECT_DIR }}" -path "*/outputs/apk/*/*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=\( (find " \){{ env.PROJECT_DIR }}" -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            find "${{ env.PROJECT_DIR }}/app/build" -type f 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "Found APK: $APK"
          mkdir -p collected
          cp "$APK" collected/SC-Manager-debug.apk
          ls -lh collected/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-Manager-debug-apk
          path: collected/SC-Manager-debug.apk
          if-no-files-found: error
          retention-days: 14
