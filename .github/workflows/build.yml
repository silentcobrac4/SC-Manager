name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ ! -f SCManager.zip ]; then
            echo "SCManager.zip not found in repo root"
            ls -la
            exit 1
          fi
          unzip -o SCManager.zip -d work
          # دعم الحالتين: محتويات داخل مجلد SCManager أو مباشرة
          if [ -d work/SCManager ]; then
            echo "PROJECT_DIR=work/SCManager" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=work" >> $GITHUB_ENV
          fi
          echo "Project structure:"
          find work -maxdepth 3 -type f | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-Manager-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
