name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files
        run: ls -la

      - name: Unzip project
        run: |
          set -e
          if [ -f SCManager.zip ]; then
            echo "Found SCManager.zip"
            unzip -o SCManager.zip -d work
          else
            ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "Found $ZIP"
              unzip -o "$ZIP" -d work
            elif [ -f settings.gradle.kts ]; then
              echo "PROJECT_DIR=." >> $GITHUB_ENV
              exit 0
            else
              echo "ERROR: Add SCManager.zip to repo root"
              ls -la
              exit 1
            fi
          fi

          if [ -f work/SCManager/settings.gradle.kts ]; then
            echo "PROJECT_DIR=work/SCManager" >> $GITHUB_ENV
          elif [ -f work/settings.gradle.kts ]; then
            echo "PROJECT_DIR=work" >> $GITHUB_ENV
          else
            FOUND=$(find work -name "settings.gradle.kts" | head -1)
            if [ -n "$FOUND" ]; then
              echo "PROJECT_DIR=$(dirname "$FOUND")" >> $GITHUB_ENV
            else
              echo "settings.gradle.kts not found"
              find work -maxdepth 4 -type f | head -50
              exit 1
            fi
          fi
          grep PROJECT_DIR $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          echo "Building in $(pwd)"
          ls -la
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: find "${{ env.PROJECT_DIR }}" -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SC-Manager-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
